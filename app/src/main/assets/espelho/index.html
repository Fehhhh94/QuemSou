<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>QuemSou — Espelho de leitura</title>
  <!--
    Cliente do espelho de leitura (Fase 4A, parte 1). Sem framework e sem
    CDN de propósito: a mesa pode estar sem internet, e tudo é servido pelo
    aparelho do anfitrião. Visual sóbrio e escuro — este é um apoio de
    leitura, não uma segunda cópia da tela do app.
  -->
  <style>
    :root {
      --fundo: #101014;
      --superficie: #1b1b21;
      --borda: #2e2e38;
      --texto: #ecebf0;
      --texto-fraco: #9a99a6;
      --acento: #7f7af0;
      --erro: #f08a8a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
    }

    .cabecalho { margin-bottom: 1.5rem; }

    .titulo {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitulo {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      color: var(--texto-fraco);
      line-height: 1.45;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nome {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3.5rem;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--borda);
      border-radius: 0.75rem;
      background: var(--superficie);
      color: var(--texto);
      font: inherit;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .nome:active { background: #24242c; }

    .nome[disabled] {
      opacity: 0.4;
      cursor: default;
    }

    .marca {
      font-size: 0.8rem;
      color: var(--texto-fraco);
      white-space: nowrap;
    }

    .aviso {
      margin: 0 0 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.6rem;
      background: rgba(240, 138, 138, 0.12);
      color: var(--erro);
      font-size: 0.9rem;
    }

    .aviso[hidden] { display: none; }

    .espera {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 3.5rem 1rem;
      text-align: center;
    }

    .espera-nome {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
    }

    .espera-texto {
      margin: 0;
      color: var(--texto-fraco);
      font-size: 0.95rem;
    }

    .ponto {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--acento);
      opacity: 0.35;
      animation: pulsa 1.8s ease-in-out infinite;
    }

    @keyframes pulsa {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ponto { animation: none; opacity: 0.6; }
    }

    .rodape {
      margin-top: 2rem;
      color: var(--texto-fraco);
      font-size: 0.8rem;
      text-align: center;
    }

    .trocar {
      margin-top: 1.5rem;
      background: none;
      border: none;
      color: var(--texto-fraco);
      font: inherit;
      font-size: 0.85rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="espera-texto">Carregando…</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
